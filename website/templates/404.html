{% extends "website/base.html" %}
{% load i18n %}
{% block title %}404{% endblock %}
{% block content %}
<section class="section-pad error-page">
  <div class="container text-center">
    <p class="error-code">404</p>
    <h1 class="h3 mb-2">{% trans "Page not found" %}</h1>
    <p class="text-muted mb-4">{% trans "The page you are looking for does not exist or has been moved." %}</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a href="{% url 'website:home' %}" class="btn-mdi-primary"><i class="bi bi-house me-1"></i>{% trans "Home" %}</a>
      <a href="{% url 'website:what_we_do' %}" class="btn-mdi-outline" style="color:var(--mdi-red);border-color:var(--mdi-red);">{% trans "What We Do" %}</a>
      <a href="{% url 'website:news_list' %}" class="btn-mdi-outline" style="color:var(--mdi-red);border-color:var(--mdi-red);">{% trans "News" %}</a>
    </div>
  </div>
</section>
{% endblock %}
