{% load static %}
<!DOCTYPE html>
<html lang="tet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Painel {{ site_config.short_name }}</title>
<link rel="icon" type="image/png" href="{% static 'Website/img/logo-mdi.png' %}">
<link rel="stylesheet" href="{% static 'Website/vendor/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'Website/vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
<link rel="stylesheet" href="{% static 'Main/css/dashboard.css' %}">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="{% static 'Website/img/logo-mdi.png' %}" alt="Logo" style="height:64px;">
      <h5 class="mt-3 mb-0">{{ site_config.site_name|default:"Mata Dalan Institute" }}</h5>
      <div class="text-muted small">Painel Administrasaun</div>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-danger w-100">Tama / Login</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-0">
      <a href="{% url 'Website:home' %}">&laquo; Fila ba Website Públiku</a>
    </p>
  </div>
</div>
</body>
</html>
