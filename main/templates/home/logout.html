{% load static %}
<!DOCTYPE html>
<html lang="tet">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout | Painel {{ site_config.short_name }}</title>
<link rel="icon" type="image/png" href="{% static 'website/img/logo-mdi.png' %}">
<link rel="stylesheet" href="{% static 'website/vendor/bootstrap/css/bootstrap.min.css' %}">

</head>
<body class="login-body">
<div class="login-wrap">

    <h5 class="mt-3">Ita Log Out Ho Susesu</h5>
    <p class="text-muted small">Obrigadu ba servisu iha painel {{ site_config.short_name|default:"MDI" }}.</p>
    <a href="{% url 'main:login' %}" class="btn btn-danger w-100 mt-2">Tama Fila Fali</a>
    <a href="{% url 'website:home' %}" class="btn btn-outline-secondary w-100 mt-2">Fila ba Website Públiku</a>

</html>
